spring.application.name=SpringCRUD
server.port=9090

# ==============================
# PostgreSQL
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:4200/student_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==============================
# JSP
# ==============================

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


app.jwt.secret=${JWT_SECRET:c2VjdXJlLWp3xdfdfgsdgdfgdfgdfgdfgdfgdC1ocy01MTItc3VwZXItc2VjcmV0LWtleS1mb3ItcHJvZHVjdGlvbg==}
app.jwt.expiration=${JWT_EXPIRATION:900000}


app.upload.dir=uploads/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB